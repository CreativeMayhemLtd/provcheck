# Dependabot version-update config.
#
# Security updates run separately and require Dependabot to be enabled
# in repo settings (Security & analysis tab). Version updates land here
# as PRs against `main`.
#
# Cadence: weekly. Daily creates noise; monthly leaves vulnerabilities
# open too long. We're not Spectre-hunting in a finance app; weekly is
# the right beat for this project's release rhythm.
#
# Three ecosystems matter:
#   - cargo: every Rust crate in the workspace + the Tauri app's
#     separate workspace at app/src-tauri.
#   - github-actions: workflow action pins (actions/checkout, etc.)
#     drift fast; bumps usually fix supply-chain advisories.
#   - We do NOT ship a package.json or npm tree — app/dist/ is hand-
#     written vanilla JS, no node_modules. Skip npm.

version: 2
updates:
  # Main Rust workspace
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
      include: scope
    # Group patch + minor bumps into a single weekly PR to cut review
    # cost. Majors stay separate — they usually break.
    groups:
      cargo-patch:
        update-types:
          - patch
      cargo-minor:
        update-types:
          - minor
    # Parked majors (deliberate-build-session review, 2026-07). These
    # keep re-opening a separate PR every week for a bump we are not
    # taking yet. rubato 0.16 -> 3.0 is a full API rewrite (real
    # porting work, no security driver). tract 0.21 -> 0.22 is deferred
    # because the audio detectors are migrating off tract onto ort (see
    # SECURITY.md), so bumping tract is wasted effort. symphonia is
    # NOT ignored: its 0.5 -> 0.6 bump is wanted, just needs its own
    # codec-survival validation, so its PR stays visible as a reminder.
    # Unignore either line below when that work is scheduled.
    ignore:
      - dependency-name: "rubato"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tract-onnx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tract-nnef"
        update-types: ["version-update:semver-major"]

  # Tauri app — separate Cargo workspace (per app/src-tauri/Cargo.toml's
  # empty [workspace] marker).
  - package-ecosystem: cargo
    directory: "/app/src-tauri"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
      - tauri
    commit-message:
      prefix: deps(tauri)
      include: scope
    groups:
      tauri-patch:
        update-types:
          - patch
      tauri-minor:
        update-types:
          - minor
    # Same tract park as the main workspace: the audio detectors are
    # migrating off tract onto ort, so a tract major here is wasted
    # effort. Unignore when the ort migration is done.
    ignore:
      - dependency-name: "tract-onnx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tract-nnef"
        update-types: ["version-update:semver-major"]

  # CI action pins
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    # Group all action pins into one weekly PR. Action bumps are
    # low-risk supply-chain hygiene; reviewing them one-by-one (as
    # setup-python, codeql-action, and upload-artifact each did) just
    # multiplies CI runs for no added signal.
    groups:
      github-actions:
        patterns:
          - "*"

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; color: #1a1a1a; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      label { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
      input[type="text"] { width: 100%; box-sizing: border-box; padding: 4px 6px; margin-top: 2px; }
      .grp { border-top: 1px solid #ddd; margin-top: 8px; padding-top: 6px; }
      .muted { color: #777; font-size: 11px; margin-top: 8px; }
      select { padding: 3px; }
    </style>
  </head>
  <body>
    <h1>provcheck filter</h1>
    <label><input type="checkbox" id="enabled" /> <b>Enable filtering on this tab</b></label>

    <div class="grp">
      <div>Hide/blur media when:</div>
      <label><input type="checkbox" id="c2paPresent" /> C2PA provenance present</label>
      <label><input type="checkbox" id="c2paAbsent" /> C2PA provenance absent</label>
      <label><input type="checkbox" id="aiPresent" /> AI marker present</label>
      <label>Keyword match<input type="text" id="keyword" placeholder="e.g. deepfake" /></label>
    </div>

    <div class="grp">
      <label>Action
        <select id="action">
          <option value="blur">Blur</option>
          <option value="hide">Hide</option>
        </select>
      </label>
      <label><input type="checkbox" id="badge" /> Show provenance badge (hover)</label>
    </div>
    <div class="muted" id="note">C2PA and AI use local byte-scan presence detection (not full signature validation). Nothing leaves your browser.</div>
    <script src="popup.js"></script>
  </body>
</html>

# Opt-in, NOT part of the provcheck workspace or the release binary.
#
# This crate is AGPL-3.0-or-later plus a separate commercial option (see
# ./LICENSING.md), which fails the workspace's own WATERMARK_LICENSE_POLICY.md
# rule for anything bundled into the Apache-2.0 binary. It is therefore excluded
# from the workspace and never wired into the detector dispatch. Build it standalone:
#
#   cargo build --manifest-path crates/provcheck-mellin/Cargo.toml
#
# Ported from lysn (crates/lysn-watermark/src/mellin.rs). The keying (HMAC
# label "lysn-mellin-key/v1", PRNG, ±1 pattern) MUST stay bit-identical with
# the lysn source so marks embedded there detect here and vice versa.
[package]
name = "provcheck-mellin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later OR LicenseRef-provcheck-mellin-Commercial"
authors = ["Creative Mayhem UG <info@rAIdio.bot>"]
repository = "https://github.com/CreativeMayhemLtd/provcheck"
description = "Keyed spectral (Fourier-Mellin) forensic watermark channel: scale/stretch-invariant embed + detect over i16 PCM. AGPL-3.0-or-later or commercial, opt-in, never bundled into the Apache-2.0 provcheck binary."
# Dual-licensed (AGPL-or-commercial, with a custom commercial LicenseRef); never
# let this reach crates.io by accident.
publish = false

[dependencies]
hmac = "0.12"
sha2 = "0.10"
# WAV writing for the embed output (lossless home format). MIT/Apache-2.0.
hound = "3"
# Decoding leaked copies in any format on the read side (MP3/AAC/FLAC/etc.), so
# the transcode-invariant channel can actually be exercised against real leaks.
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "isomp4", "ogg", "vorbis", "wav"] }

# The keyed-serial file watermark CLI. Opt-in binary, never in the FOSS release.
[[bin]]
name = "provcheck-mellin"
path = "src/bin/mellin.rs"

# The Tardos soundness tests run tens of millions of HMAC-SHA256 evaluations, so
# an unoptimized `cargo test` is minutes-slow. Optimize the test build (crate plus
# deps) to keep it near the ~16 s release time. `cargo build`/`run` (the dev
# profile) stays unoptimized and debuggable apart from the always-hot deps.
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# Standalone: do not join the parent provcheck workspace (which is pure Apache-2.0).
[workspace]
